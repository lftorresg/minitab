<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#6A7DFF"/>
      <stop offset="0.55" stop-color="#4A3FD0"/>
      <stop offset="1" stop-color="#2B1F86"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF1FF"/>
      <stop offset="1" stop-color="#D9DEFF"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#FFB13D"/>
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="winShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#120A4A" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <!-- Icon body (Apple 1024 grid: 824px squircle-ish body) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#iconShadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>

  <g clip-path="url(#body)">
    <!-- Back windows (cascade) -->
    <rect x="214" y="246" width="440" height="320" rx="38" fill="#FFFFFF" fill-opacity="0.18"/>
    <rect x="214" y="246" width="440" height="58" rx="38" fill="#FFFFFF" fill-opacity="0.10"/>

    <rect x="282" y="322" width="440" height="320" rx="38" fill="#FFFFFF" fill-opacity="0.32" filter="url(#winShadow)"/>

    <!-- Selection glow + ring around the front window -->
    <rect x="334" y="384" width="476" height="356" rx="58" fill="none" stroke="#FFC94D" stroke-width="26" opacity="0.65" filter="url(#glow)"/>
    <rect x="334" y="384" width="476" height="356" rx="58" fill="none" stroke="url(#ring)" stroke-width="18"/>

    <!-- Front (selected) window -->
    <rect x="352" y="402" width="440" height="320" rx="40" fill="url(#screen)"/>
    <path d="M352 442 a40 40 0 0 1 40 -40 h360 a40 40 0 0 1 40 40 v26 h-440 z" fill="#FFFFFF"/>
    <circle cx="392" cy="436" r="11" fill="#B9BEE8"/>
    <circle cx="426" cy="436" r="11" fill="#B9BEE8"/>
    <circle cx="460" cy="436" r="11" fill="#B9BEE8"/>
    <!-- abstract content -->
    <rect x="392" y="508" width="200" height="26" rx="13" fill="#5B5FE0" fill-opacity="0.85"/>
    <rect x="392" y="556" width="340" height="18" rx="9" fill="#5B5FE0" fill-opacity="0.28"/>
    <rect x="392" y="590" width="300" height="18" rx="9" fill="#5B5FE0" fill-opacity="0.28"/>
    <rect x="392" y="624" width="250" height="18" rx="9" fill="#5B5FE0" fill-opacity="0.28"/>
  </g>
</svg>
